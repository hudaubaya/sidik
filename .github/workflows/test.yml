name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Icarus Verilog, Yosys and Tcl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iverilog yosys tcl
          iverilog -V 2>&1 | head -1
          yosys -V

      - name: Install Python dependencies
        run: make install

      - name: Run tests
        run: make test

      - name: Synthesis check (RO stages preserved)
        run: make synth-check

      - name: Upload cocotb results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cocotb-results
          path: tb/*/results.xml
          if-no-files-found: ignore
